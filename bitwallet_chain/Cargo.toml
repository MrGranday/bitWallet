[package]
name = "bitwallet_chain"
version = "0.1.0"
edition = "2021"

[dependencies]
# --- Core Bitcoin Wallet Engine ---
bdk = { version = "0.30.2", default-features = false, features = ["compiler", "use-esplora-reqwest"] }
bdk_esplora = "0.22.1"

# --- Data Handling ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# --- Utilities ---
dotenvy = "0.15"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
